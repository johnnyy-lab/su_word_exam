<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <title>注音聲調標在旁邊：網頁試樣</title>
  <style>
    @font-face {
      font-family: "BopomofoRuby1909-v1";
      src: url("font/BopomofoRuby1909-v1-Regular.ttf") format("truetype");
      font-display: block;
    }
    body {
      margin: 24px;
      font-family: "PMingLiU", "新細明體", serif;
      color: #1a1a1a;
      background: #fff;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p.note { margin: 0 0 18px; line-height: 1.6; }
    h2 { font-size: 16px; margin: 22px 0 8px; background: #e8eef2; padding: 4px 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .item { text-align: center; }
    .cap { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    .kai { font-family: "標楷體", "DFKai-SB", serif; }
    .rubyfont { font-family: "BopomofoRuby1909-v1", "標楷體", serif; }
    .sample { font-size: 28px; line-height: 1.15; }
    .upright { text-orientation: upright; }
    .vert {
      writing-mode: vertical-rl;
      text-orientation: upright;
      height: 4.6em;
    }
    .feat-ruby { font-feature-settings: "salt" 1; }
    .feat-vert { font-feature-settings: "vert" 1; }
    .narrow .sample { font-size: 10pt; }
    .hside, .vside {
      display: inline-flex;
      align-items: flex-start;
      justify-content: center;
    }
    .htone, .vtone {
      font-size: 0.48em;
      line-height: 1;
      margin-left: 0.04em;
    }
    .hside.light .htone, .vside.light .vtone { order: -1; margin-left: 0; margin-right: 0.04em; }
    .vletters { writing-mode: vertical-rl; text-orientation: upright; line-height: 1; }
    .box {
      box-sizing: border-box;
      border: 1px solid #222;
      min-width: 3.2em;
      min-height: 1.55em;
      display: inline-flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0.12em 0.15em 0.08em;
    }
    .narrow {
      width: 35.2pt;
      min-width: 35.2pt;
      max-width: 35.2pt;
      overflow: hidden;
      border-color: #888;
      font-size: 10pt;
      min-height: 0;
      height: 28pt;
      align-items: center;
    }
    .narrow.tall {
      height: 52pt;
      align-items: flex-start;
    }
    .narrow.overflow { outline: 2px solid #c0392b; }
    pre#log {
      margin-top: 20px;
      font-family: Consolas, monospace;
      font-size: 12px;
      background: #f6f6f6;
      padding: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>注音聲調標在旁邊：網頁試樣</h1>
  <p class="note">對照現況（聲調接在注音後面，直排時變成下一個字）與原卷式（二、三、四聲在右上，輕聲在前，一聲無號）。字型試樣使用中文數位化技術推廣基金會公開的 BopomofoRuby1909（OFL）。窄格寬 35.2pt，等於目前 B4 橫式直書一欄。</p>

  <h2>1. 現況，標楷體橫排</h2>
  <div class="row" id="sec-now-h"></div>

  <h2>2. 現況，標楷體直排</h2>
  <div class="row" id="sec-now-v"></div>

  <h2>3. 注音字型橫排，開啟 salt 特性</h2>
  <div class="row" id="sec-font-h"></div>

  <h2>4. 注音字型橫排，聲調已換成組合附加符號</h2>
  <div class="row" id="sec-font-comb"></div>

  <h2>5. 注音字型直排，開啟 vert 特性</h2>
  <div class="row" id="sec-font-v"></div>

  <h2>6. 手動排版橫排（標楷體，不靠特殊字型）</h2>
  <div class="row" id="sec-hand-h"></div>

  <h2>7. 手動排版直排（注音直排，聲調在旁邊）</h2>
  <div class="row" id="sec-hand-v"></div>

  <h2>8. 原卷式作答格，以及 B4 欄寬能不能放下</h2>
  <div class="row" id="sec-box"></div>

  <pre id="log"></pre>
  <script>
    const samples = [
      ["一聲", "ㄓ", ""],
      ["二聲", "ㄕ", "ˊ"],
      ["三聲", "ㄓㄜ", "ˇ"],
      ["四聲", "ㄧㄡ", "ˋ"],
      ["輕聲", "ㄉㄜ", "˙"],
      ["四碼", "ㄊㄧㄠ", "ˋ"]
    ];
    const comb = { "ˊ": "\u0301", "ˇ": "\u030c", "ˋ": "\u0300" };

    function inlineText(letters, tone) {
      if (tone === "˙") return "˙" + letters;
      return letters + tone;
    }

    function addItem(parent, cap, node, measureKey) {
      const item = document.createElement("div");
      item.className = "item";
      const c = document.createElement("span");
      c.className = "cap";
      c.textContent = cap;
      item.appendChild(c);
      if (measureKey) node.dataset.measure = measureKey;
      item.appendChild(node);
      parent.appendChild(item);
    }

    function plain(cls, text) {
      const s = document.createElement("span");
      s.className = cls;
      s.textContent = text;
      return s;
    }

    function hand(horizontal, letters, tone) {
      const wrap = document.createElement("span");
      wrap.className = (horizontal ? "hside" : "vside") + (tone === "˙" ? " light" : "") + " sample kai";
      if (!horizontal) {
        const lettersEl = document.createElement("span");
        lettersEl.className = "vletters";
        lettersEl.textContent = letters;
        wrap.appendChild(lettersEl);
      } else {
        wrap.appendChild(document.createTextNode(letters));
      }
      if (tone) {
        const t = document.createElement("span");
        t.className = horizontal ? "htone" : "vtone";
        t.textContent = tone;
        wrap.appendChild(t);
      }
      return wrap;
    }

    samples.forEach(([name, letters, tone]) => {
      const text = inlineText(letters, tone);
      addItem(document.getElementById("sec-now-h"), name, plain("sample kai", text), "now-h-" + name);
      addItem(document.getElementById("sec-now-v"), name, plain("sample kai vert upright", text), "now-v-" + name);
      addItem(document.getElementById("sec-font-h"), name, plain("sample rubyfont feat-ruby", text), "font-h-" + name);
      const combText = tone === "˙" ? text : letters + (comb[tone] || "");
      addItem(document.getElementById("sec-font-comb"), name, plain("sample rubyfont", combText), "font-c-" + name);
      addItem(document.getElementById("sec-font-v"), name, plain("sample rubyfont vert upright feat-vert", text), "font-v-" + name);
      addItem(document.getElementById("sec-hand-h"), name, hand(true, letters, tone), "hand-h-" + name);
      addItem(document.getElementById("sec-hand-v"), name, hand(false, letters, tone), "hand-v-" + name);

      const box = document.createElement("span");
      box.className = "box sample kai";
      box.appendChild(hand(true, letters, tone));
      addItem(document.getElementById("sec-box"), name + " 原卷格", box, "box-" + name);

      const narrow = document.createElement("span");
      narrow.className = "box narrow kai";
      narrow.appendChild(hand(true, letters, tone));
      addItem(document.getElementById("sec-box"), name + " 橫排窄欄", narrow, "narrow-h-" + name);

      const narrowV = document.createElement("span");
      narrowV.className = "box narrow tall kai";
      narrowV.appendChild(hand(false, letters, tone));
      addItem(document.getElementById("sec-box"), name + " 直排窄欄", narrowV, "narrow-v-" + name);
    });

    const lines = [];
    document.querySelectorAll("[data-measure]").forEach((el) => {
      const tooWide = el.scrollWidth > el.clientWidth + 1;
      const tooTall = el.scrollHeight > el.clientHeight + 1;
      if (tooWide) el.classList.add("overflow");
      lines.push(el.dataset.measure + " " + Math.round(el.getBoundingClientRect().width) + "x" + Math.round(el.getBoundingClientRect().height) + (tooWide || tooTall ? " OVERFLOW" : ""));
    });
    document.getElementById("log").textContent = lines.join("\n");
  </script>
</body>
</html>
